<!DOCTYPE html>
<html lang="zh-CN" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="电商订单管理演示系统">
    <title>{% block title %}订单商城{% endblock %} · {{ app_name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: "#eff6ff",
                            100: "#dbeafe",
                            500: "#3b82f6",
                            600: "#2563eb",
                            700: "#1d4ed8",
                            900: "#1e3a8a"
                        }
                    },
                    boxShadow: {
                        soft: "0 18px 50px -28px rgba(15, 23, 42, 0.35)"
                    }
                }
            }
        };
    </script>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body class="flex min-h-full flex-col bg-slate-50 text-slate-900 antialiased">
    <header class="sticky top-0 z-40 border-b border-slate-200/80 bg-white/90 backdrop-blur">
        <div class="mx-auto flex h-16 max-w-7xl items-center justify-between gap-4 px-4 sm:px-6 lg:px-8">
            <a href="/products" class="group flex items-center gap-3">
                <span class="flex h-9 w-9 items-center justify-center rounded-xl bg-brand-600 text-lg font-bold text-white shadow-sm transition group-hover:bg-brand-700">购</span>
                <span class="hidden sm:block">
                    <span class="block text-sm font-semibold tracking-wide text-slate-900">订单商城</span>
                    <span class="block text-xs text-slate-500">FastAPI Commerce Demo</span>
                </span>
            </a>

            <nav class="flex items-center gap-1 rounded-xl bg-slate-100 p-1" aria-label="主导航">
                <a href="/products" data-nav="products" class="nav-link rounded-lg px-3 py-2 text-sm font-medium text-slate-600 transition hover:bg-white hover:text-slate-900 sm:px-4">商品列表</a>
                <a href="/orders" data-nav="orders" class="nav-link rounded-lg px-3 py-2 text-sm font-medium text-slate-600 transition hover:bg-white hover:text-slate-900 sm:px-4">我的订单</a>
            </nav>

            <div id="nav-auth" class="flex min-w-[72px] items-center justify-end gap-2" aria-live="polite"></div>
        </div>
    </header>

    <main class="flex-1">
        {% block content %}{% endblock %}
    </main>

    <footer class="border-t border-slate-200 bg-white">
        <div class="mx-auto flex max-w-7xl flex-col gap-2 px-4 py-6 text-xs text-slate-500 sm:flex-row sm:items-center sm:justify-between sm:px-6 lg:px-8">
            <span>FastAPI + PostgreSQL + Redis + Celery</span>
            <span>商品、库存、订单与超时关单流程演示</span>
        </div>
    </footer>

    <div id="toast-root" class="toast-container" aria-live="polite" aria-atomic="true"></div>

    <script src="{{ url_for('static', path='js/common.js') }}" defer></script>
    {% block scripts %}{% endblock %}
</body>
</html>

{% extends "base.html" %}

{% block title %}商品列表{% endblock %}

{% block content %}
<section class="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8">
    <div class="flex flex-col gap-5 sm:flex-row sm:items-end sm:justify-between">
        <div>
            <p class="text-xs font-semibold uppercase tracking-[0.18em] text-brand-600">Catalog</p>
            <h1 class="mt-2 text-3xl font-bold tracking-tight text-slate-900">商品列表</h1>
            <p class="mt-2 max-w-2xl text-sm leading-6 text-slate-500">浏览当前在售商品与 SKU 库存。选择数量后点击“立即购买”，系统会自动创建幂等订单并锁定库存。</p>
        </div>
        <button id="refresh-products" type="button" class="btn-secondary shrink-0">
            <span aria-hidden="true">↻</span>
            刷新商品
        </button>
    </div>

    <div id="products-summary" class="mt-6 hidden rounded-2xl border border-brand-100 bg-brand-50 px-4 py-3 text-sm text-brand-900"></div>

    <div id="products-loading" class="mt-8 grid gap-6 md:grid-cols-2 xl:grid-cols-3" aria-label="正在加载商品">
        {% for _ in range(6) %}
        <div class="rounded-3xl border border-slate-200 bg-white p-6 shadow-soft">
            <div class="skeleton h-5 w-2/3 rounded"></div>
            <div class="skeleton mt-3 h-4 w-full rounded"></div>
            <div class="skeleton mt-2 h-4 w-4/5 rounded"></div>
            <div class="mt-7 space-y-3">
                <div class="skeleton h-16 rounded-2xl"></div>
                <div class="skeleton h-16 rounded-2xl"></div>
            </div>
        </div>
        {% endfor %}
    </div>

    <div id="products-grid" class="mt-8 hidden grid gap-6 md:grid-cols-2 xl:grid-cols-3"></div>

    <div id="products-empty" class="mt-10 hidden rounded-3xl border border-dashed border-slate-300 bg-white px-6 py-16 text-center">
        <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-slate-100 text-2xl">📦</div>
        <h2 class="mt-4 text-lg font-semibold text-slate-900">暂时没有商品</h2>
        <p class="mt-2 text-sm text-slate-500">请先由管理员创建商品和 SKU，刷新后即可下单。</p>
    </div>

    <div id="products-error" class="mt-10 hidden rounded-3xl border border-rose-200 bg-rose-50 px-6 py-12 text-center">
        <h2 class="text-lg font-semibold text-rose-900">商品加载失败</h2>
        <p id="products-error-message" class="mt-2 text-sm text-rose-700"></p>
        <button type="button" data-action="retry-products" class="btn-secondary mt-5">重新加载</button>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', path='js/products.js') }}" defer></script>
{% endblock %}

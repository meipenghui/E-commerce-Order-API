{% extends "base.html" %}

{% block title %}我的订单{% endblock %}

{% block content %}
<section class="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8">
    <div class="flex flex-col gap-5 sm:flex-row sm:items-end sm:justify-between">
        <div>
            <p class="text-xs font-semibold uppercase tracking-[0.18em] text-brand-600">Orders</p>
            <h1 class="mt-2 text-3xl font-bold tracking-tight text-slate-900">我的订单</h1>
            <p class="mt-2 max-w-2xl text-sm leading-6 text-slate-500">查看订单状态、订单明细与金额。待支付订单可以继续支付、主动取消，或等待 Celery 超时任务自动关单。</p>
        </div>
        <div class="flex gap-3">
            <a href="/products" class="btn-secondary">继续购物</a>
            <button id="refresh-orders" type="button" class="btn-secondary">
                <span aria-hidden="true">↻</span>
                刷新订单
            </button>
        </div>
    </div>

    <div id="orders-summary" class="mt-6 hidden rounded-2xl border border-brand-100 bg-brand-50 px-4 py-3 text-sm text-brand-900"></div>

    <div id="orders-loading" class="mt-8 space-y-5" aria-label="正在加载订单">
        {% for _ in range(3) %}
        <div class="rounded-3xl border border-slate-200 bg-white p-6 shadow-soft">
            <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
                <div class="space-y-2">
                    <div class="skeleton h-5 w-52 rounded"></div>
                    <div class="skeleton h-4 w-36 rounded"></div>
                </div>
                <div class="skeleton h-9 w-24 rounded-full"></div>
            </div>
            <div class="skeleton mt-6 h-24 rounded-2xl"></div>
        </div>
        {% endfor %}
    </div>

    <div id="orders-list" class="mt-8 hidden space-y-5"></div>

    <div id="orders-empty" class="mt-10 hidden rounded-3xl border border-dashed border-slate-300 bg-white px-6 py-16 text-center">
        <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-slate-100 text-2xl">🧾</div>
        <h2 class="mt-4 text-lg font-semibold text-slate-900">还没有订单</h2>
        <p class="mt-2 text-sm text-slate-500">去商品列表选择一个 SKU，创建你的第一笔订单。</p>
        <a href="/products" class="btn-primary mt-5">去选购商品</a>
    </div>

    <div id="orders-error" class="mt-10 hidden rounded-3xl border border-rose-200 bg-rose-50 px-6 py-12 text-center">
        <h2 class="text-lg font-semibold text-rose-900">订单加载失败</h2>
        <p id="orders-error-message" class="mt-2 text-sm text-rose-700"></p>
        <button type="button" data-action="retry-orders" class="btn-secondary mt-5">重新加载</button>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', path='js/orders.js') }}" defer></script>
{% endblock %}

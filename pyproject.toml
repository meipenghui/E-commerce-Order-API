[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-order-api"
version = "0.1.0"
description = "Async infrastructure for an e-commerce order management API"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2.0",
    "asyncpg>=0.30,<1.0",
    "celery[redis]>=5.5,<6.0",
    "fastapi>=0.115,<1.0",
    "greenlet>=3.1,<4.0",
    "jinja2>=3.1,<4.0",
    "passlib[bcrypt]>=1.7.4,<2.0",
    "pydantic-settings>=2.6,<3.0",
    "PyJWT>=2.10,<3.0",
    "redis>=5.2,<6.0",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
